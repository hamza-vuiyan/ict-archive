<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload Document - ICT Archive</title>
</head>
<body>

<h1>Upload Document</h1>

<p th:if="${successMessage}"
   th:text="${successMessage}"
   style="color: green;"></p>

<p th:if="${errorMessage}"
   th:text="${errorMessage}"
   style="color: red;"></p>

<form th:action="@{/documents/upload}"
      method="post"
      enctype="multipart/form-data">

    <div>
        <label>Document Title</label>
        <input type="text" name="title" required>
    </div>

    <div>
        <label>Description</label>
        <textarea name="description"></textarea>
    </div>

    <div>
        <label>Course Code</label>
        <input type="text" name="courseCode"
               placeholder="ICT4103" required>
    </div>

    <div>
        <label>Course Name</label>
        <input type="text" name="courseName"
               placeholder="Digital Image Processing" required>
    </div>

    <div>
        <label>Short Name</label>
        <input type="text" name="shortName"
               placeholder="DIP" required>
    </div>

    <div>
        <label>Academic Year</label>
        <input type="number" name="academicYear"
               placeholder="2025" min="2000" required>
    </div>

    <div>
        <label>Select File</label>
        <input type="file" name="file" required>
    </div>

    <button type="submit">Upload</button>

</form>

</body>
</html>
