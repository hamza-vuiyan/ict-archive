
name: Build and Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          timeout: 2m
          command_timeout: 15m
          script: |
            set -Eeuo pipefail

            IMAGE="ghcr.io/${{ github.repository }}:latest"

            echo "Checking environment file..."
            test -s /opt/ict-archive/.env

            echo "Pulling latest Docker image..."
            docker pull "$IMAGE"

            # Protect any existing backup container.
            if docker container inspect ict-archive-previous >/dev/null 2>&1; then
              echo "Previous backup container exists. Aborting."
              exit 1
            fi

            # Preserve the currently running container.
            if docker container inspect ict-archive >/dev/null 2>&1; then
              echo "Preserving current container..."
              docker stop ict-archive
              docker rename ict-archive ict-archive-previous
            fi

            # Restore the previous container if deployment fails.
            rollback() {
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "Deployment failed. Rolling back..."

                docker rm -f ict-archive >/dev/null 2>&1 || true

                if docker container inspect ict-archive-previous >/dev/null 2>&1; then
                  docker rename ict-archive-previous ict-archive
                  docker start ict-archive
                fi
              fi
            }

            trap rollback EXIT

            echo "Preparing persistent storage..."
            sudo mkdir -p /opt/ict-archive/uploads

            echo "Starting new container..."
            docker run -d \
              --name ict-archive \
              --restart unless-stopped \
              --env-file /opt/ict-archive/.env \
              -e STORAGE_LOCATION=/app/uploads \
              -v /opt/ict-archive/uploads:/app/uploads \
              -p 8080:8080 \
              "$IMAGE"

            echo "Waiting for application health..."

            HEALTHY=0

            for attempt in $(seq 1 30); do
              HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
                http://127.0.0.1:8080/health || true)

              if [ "$HTTP_CODE" = "200" ]; then
                HEALTHY=1
                break
              fi

              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Application failed health check."
              docker logs --tail 80 ict-archive || true
              exit 1
            fi

            echo "Application is healthy!"

            # Remove old container only after successful verification.
            docker rm -f ict-archive-previous || true

            trap - EXIT

            echo "Deployment completed successfully!"